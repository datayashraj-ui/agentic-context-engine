name: NEXUS CI/CD Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.11"

jobs:
  # ============================================================
  # JOB 1: AI Code Review (on every PR)
  # Continue CLI runs security, quality, and architecture checks
  # ============================================================
  ai-checks:
    name: AI Code Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: write
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Continue CLI
        run: npm install -g @continuedev/continue-cli@latest

      - name: Run AI Security Check
        id: security-check
        run: |
          continue check \
            --check .continue/checks/security.md \
            --diff origin/main...HEAD \
            --output security-result.txt \
            --api-key "${{ secrets.CONTINUE_API_KEY }}" \
            --model "claude-sonnet-4-5-20251001" || true
          cat security-result.txt

      - name: Run AI Quality Check
        id: quality-check
        run: |
          continue check \
            --check .continue/checks/code-quality.md \
            --diff origin/main...HEAD \
            --output quality-result.txt \
            --api-key "${{ secrets.CONTINUE_API_KEY }}" \
            --model "claude-sonnet-4-5-20251001" || true
          cat quality-result.txt

      - name: Run AI Architecture Check
        id: arch-check
        run: |
          continue check \
            --check .continue/checks/architecture.md \
            --diff origin/main...HEAD \
            --output arch-result.txt \
            --api-key "${{ secrets.CONTINUE_API_KEY }}" \
            --model "claude-sonnet-4-5-20251001" || true
          cat arch-result.txt

      - name: Compose PR Comment
        id: compose-comment
        run: |
          SECURITY=$(cat security-result.txt)
          QUALITY=$(cat quality-result.txt)
          ARCH=$(cat arch-result.txt)

          # Check for FAIL in any result
          OVERALL="✅ All checks passed"
          if echo "$SECURITY$QUALITY$ARCH" | grep -q "FAIL"; then
            OVERALL="❌ Some checks failed — review before merging"
          fi

          cat << EOF > pr-comment.md
          ## NEXUS AI Code Review

          $OVERALL

          ---

          ### 🔐 Security Check
          $SECURITY

          ---

          ### 🏗️ Code Quality Check
          $QUALITY

          ---

          ### 🏛️ Architecture Check
          $ARCH

          ---
          *Reviewed by Continue CLI + Claude Sonnet 4.5*
          EOF

      - name: Post PR Comment
        uses: thollander/actions-comment-pull-request@v2
        with:
          filePath: pr-comment.md
          comment_tag: nexus-ai-review

  # ============================================================
  # JOB 2: Tests (on PR + push)
  # ============================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python dependencies
        working-directory: nexus/products/elevenlabs-clone/backend
        run: pip install -r requirements.txt pytest pytest-asyncio httpx
        continue-on-error: true  # Skip if directory doesn't exist yet

      - name: Run Python tests
        working-directory: nexus/products/elevenlabs-clone/backend
        run: python -m pytest tests/ -v --tb=short
        continue-on-error: true

      - name: Install Node dependencies
        working-directory: nexus/products/elevenlabs-clone/frontend
        run: npm ci
        continue-on-error: true

      - name: Run TypeScript checks
        working-directory: nexus/products/elevenlabs-clone/frontend
        run: npx tsc --noEmit
        continue-on-error: true

  # ============================================================
  # JOB 3: Security Scan (on merge to main only)
  # Full security scan: Semgrep + TruffleHog + Trivy
  # ============================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/python
            p/typescript
            p/owasp-top-ten
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: false

      - name: Run TruffleHog (secret scan)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before }}
          head: HEAD
          extra_args: --only-verified
        continue-on-error: false

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # ============================================================
  # JOB 4: Deploy (only if security scan passes)
  # Trigger Coolify deployment webhook
  # ============================================================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Coolify Deployment
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"trigger": "github-actions", "commit": "${{ github.sha }}"}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "Coolify response: $HTTP_CODE"
          echo "$BODY"

          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "Deployment trigger failed with HTTP $HTTP_CODE"
            exit 1
          fi

          echo "Deployment triggered successfully!"

      - name: Wait for deployment
        run: |
          echo "Waiting 60 seconds for deployment to complete..."
          sleep 60

      - name: Health check
        run: |
          # Check if the app is responding
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://${{ secrets.PRODUCTION_URL }}/api/health" || echo "000")

          if [ "$STATUS" = "200" ]; then
            echo "✅ Deployment successful! App is healthy."
          else
            echo "⚠️ App returned HTTP $STATUS. Check Coolify logs."
            # Don't fail CI here — Coolify handles rollback
          fi

      - name: Notify CEO via Telegram
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            MESSAGE="✅ Deployed! Voice Lab is live. Commit: ${{ github.sha }}"
          else
            MESSAGE="❌ Deploy failed at security scan or tests. Check GitHub Actions."
          fi

          curl -s -X POST \
            "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.FOUNDER_TELEGRAM_ID }}&text=${MESSAGE}"
